<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Monitor — prod-api-02</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monitor">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // 아이폰 홈 화면 앱: 화면 높이를 화면 전체(screen)로 고정한다 (iOS 가 상단 시간 줄만큼 짧게 잡는 오류 때문에 하단바 아래가 비는 것을 막음)
  (function () {
    if (navigator.standalone !== true) return;
    var fix = function () { var land = innerWidth > innerHeight; var full = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height); document.documentElement.style.setProperty('--app-h', Math.max(full, innerHeight) + 'px'); };
    fix(); addEventListener('resize', fix); addEventListener('orientationchange', function () { setTimeout(fix, 300); });
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=4">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=4">
</head>
<body>
<div id="app"></div>
<noscript>JavaScript 가 필요해요.</noscript>
<script src="boot.js"></script>
</body>
</html>
